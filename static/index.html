<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R Pharmacy Promotion Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 antialiased">

    <!-- Top Navigation Header -->
    <header class="bg-emerald-900 border-b border-emerald-950 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="p-2.5 bg-emerald-800/60 rounded-xl text-emerald-300 border border-emerald-700/50">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                        R Pharmacy Promotion Tracker
                        <span class="px-2 py-0.5 text-[10px] font-semibold bg-emerald-500/20 text-emerald-300 rounded-full border border-emerald-400/30">Live</span>
                    </h1>
                    <p class="text-xs text-emerald-200/70">A&P Budget & Claim Management System</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <a href="/api/backup-db" class="px-3.5 py-2 rounded-lg border border-emerald-700 hover:bg-emerald-800 text-emerald-100 text-xs font-medium transition flex items-center gap-1.5 shadow-sm">
                    <svg class="w-4 h-4 text-emerald-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    Export DB
                </a>
                <button onclick="openModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-xs font-semibold transition shadow-sm flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    + New Promotion
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

        <!-- Stat Cards Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex justify-between items-start">
                <div class="space-y-1">
                    <span class="text-xs font-semibold tracking-wider text-slate-400 uppercase">TOTAL BUDGET</span>
                    <div id="stat-total-budget" class="text-2xl font-bold text-slate-900">RM 0.00</div>
                </div>
                <div class="p-2.5 bg-slate-100 rounded-lg text-slate-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex justify-between items-start">
                <div class="space-y-1">
                    <span class="text-xs font-semibold tracking-wider text-slate-400 uppercase">TOTAL CLAIMED</span>
                    <div id="stat-total-claimed" class="text-2xl font-bold text-emerald-600">RM 0.00</div>
                </div>
                <div class="p-2.5 bg-emerald-50 rounded-lg text-emerald-600 border border-emerald-100">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex justify-between items-start">
                <div class="space-y-1">
                    <span class="text-xs font-semibold tracking-wider text-slate-400 uppercase">PROMOTIONS COUNT</span>
                    <div id="stat-total-count" class="text-2xl font-bold text-indigo-600">0</div>
                </div>
                <div class="p-2.5 bg-indigo-50 rounded-lg text-indigo-600 border border-indigo-100">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                </div>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row gap-4 justify-between items-center">
            <div id="brand-filters" class="flex items-center gap-2 overflow-x-auto w-full sm:w-auto pb-1 sm:pb-0">
                <button onclick="filterBrand('')" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-emerald-100 text-emerald-800 border border-emerald-200 shadow-sm">ALL BRANDS</button>
            </div>
            <div class="relative w-full sm:w-80">
                <input type="text" id="search-input" onkeyup="fetchData()" placeholder="Search Description / DR / Case / Invoice..." class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition">
                <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>
        </div>

        <!-- Data Table -->
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-[11px] font-bold tracking-wider text-slate-500 uppercase">
                            <th class="py-3.5 px-4">DATE</th>
                            <th class="py-3.5 px-4">BRAND</th>
                            <th class="py-3.5 px-4">AGENCY CODE</th>
                            <th class="py-3.5 px-4">MASTER CASE NO</th>
                            <th class="py-3.5 px-4">MASTER DR NO</th>
                            <th class="py-3.5 px-4 text-right">BUDGET</th>
                            <th class="py-3.5 px-4 text-right">CLAIMED</th>
                            <th class="py-3.5 px-4 text-center">ACTIONS</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-100 text-xs text-slate-700">
                    </tbody>
                </table>
            </div>

            <div id="empty-state" class="hidden py-12 text-center space-y-3">
                <div class="inline-flex p-3 bg-slate-100 rounded-full text-slate-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg>
                </div>
                <p class="text-xs text-slate-500 font-medium">No promotion records found matching your search.</p>
            </div>
        </div>
    </main>

    <!-- 100% 精准对应你截图的 Modal 弹窗 -->
    <div id="modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-200 max-w-xl w-full overflow-hidden p-6 space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-900">New Promotion Record</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <form id="promo-form" onsubmit="submitPromotion(event)" class="space-y-4">
                <!-- Row 1: Date & Brand -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Date</label>
                        <input type="date" id="form-date" required class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Brand</label>
                        <input type="text" id="form-brand" required placeholder="E.G. JORDAN" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500">
                    </div>
                </div>

                <!-- Row 2: Agency Code & Budget Amount -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Agency Code</label>
                        <input type="text" id="form-agency" placeholder="e.g. H03" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Budget Amount (RM)</label>
                        <input type="number" step="0.01" id="form-budget" placeholder="0.00" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500">
                    </div>
                </div>

                <!-- Row 3: Description -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5">Description</label>
                    <input type="text" id="form-description" placeholder="Promotion title and description" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500">
                </div>

                <!-- Row 4: Master Case No & Master DR No -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Master Case No</label>
                        <input type="text" id="form-master-case" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Master DR No</label>
                        <input type="text" id="form-master-dr" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500">
                    </div>
                </div>

                <!-- Row 5: Promotion Period Container -->
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 space-y-2">
                    <label class="block text-xs font-bold text-slate-700">Promotion Period</label>
                    <div class="grid grid-cols-2 gap-4">
                        <input type="date" id="form-start-date" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500">
                        <input type="date" id="form-end-date" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500">
                    </div>
                </div>

                <!-- Footer Action Buttons -->
                <div class="pt-4 flex justify-end gap-3">
                    <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition">Cancel</button>
                    <button type="submit" class="bg-emerald-700 hover:bg-emerald-800 text-white px-5 py-2.5 rounded-xl text-xs font-semibold transition shadow-sm">Save Record</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript 完整数据打通逻辑 -->
    <script>
        let selectedBrand = '';

        // 自动将 Date 默认设置为今天
        document.getElementById('form-date').valueAsDate = new Date();

        function openModal() {
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('promo-form').reset();
            document.getElementById('form-date').valueAsDate = new Date();
        }

        function filterBrand(brand) {
            selectedBrand = brand;
            fetchData();
        }

        async function submitPromotion(e) {
            e.preventDefault();
            
            // 全全面面兼容后端 Python API 字段命名
            const payload = {
                date: document.getElementById('form-date').value,
                brand: document.getElementById('form-brand').value,
                agency_code: document.getElementById('form-agency').value,
                agency: document.getElementById('form-agency').value,
                budget_amount: parseFloat(document.getElementById('form-budget').value) || 0,
                budget: parseFloat(document.getElementById('form-budget').value) || 0,
                description: document.getElementById('form-description').value,
                master_case_no: document.getElementById('form-master-case').value,
                master_case: document.getElementById('form-master-case').value,
                master_dr_no: document.getElementById('form-master-dr').value,
                dr_number: document.getElementById('form-master-dr').value,
                start_date: document.getElementById('form-start-date').value,
                end_date: document.getElementById('form-end-date').value,
                claimed_amount: 0,
                claimed: 0
            };

            try {
                const res = await fetch('/api/promotions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    closeModal();
                    fetchData();
                } else {
                    const err = await res.json();
                    alert('Save failed: ' + (err.error || 'Check server logs'));
                }
            } catch (err) {
                alert('Network error, please try again.');
            }
        }

        async function deleteRow(id) {
            if (!confirm('Are you sure you want to delete this promotion?')) return;
            const res = await fetch(`/api/promotions/${id}`, { method: 'DELETE' });
            if (res.ok) fetchData();
        }

        async function fetchData() {
            const search = document.getElementById('search-input').value;
            let url = `/api/promotions?search=${encodeURIComponent(search)}`;
            if (selectedBrand) url += `&brand=${encodeURIComponent(selectedBrand)}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                
                const tbody = document.getElementById('table-body');
                const emptyState = document.getElementById('empty-state');
                tbody.innerHTML = '';

                let totalBudget = 0;
                let totalClaimed = 0;

                if (!data || data.length === 0) {
                    emptyState.classList.remove('hidden');
                } else {
                    emptyState.classList.add('hidden');
                    data.forEach(item => {
                        const b = parseFloat(item.budget_amount || item.budget || 0);
                        const c = parseFloat(item.claimed_amount || item.claimed || 0);
                        totalBudget += b;
                        totalClaimed += c;

                        const row = `
                            <tr class="hover:bg-slate-50/80 transition border-b border-slate-100">
                                <td class="py-3.5 px-4 font-medium text-slate-500">${item.date || '-'}</td>
                                <td class="py-3.5 px-4 font-semibold text-slate-900">${item.brand || '-'}</td>
                                <td class="py-3.5 px-4 text-slate-600">${item.agency_code || item.agency || '-'}</td>
                                <td class="py-3.5 px-4 text-slate-600">${item.master_case_no || item.master_case || '-'}</td>
                                <td class="py-3.5 px-4 text-slate-600">${item.master_dr_no || item.dr_number || '-'}</td>
                                <td class="py-3.5 px-4 text-right font-medium text-slate-900">RM ${b.toFixed(2)}</td>
                                <td class="py-3.5 px-4 text-right font-semibold text-emerald-600">RM ${c.toFixed(2)}</td>
                                <td class="py-3.5 px-4 text-center">
                                    <button onclick="deleteRow(${item.id})" class="text-slate-400 hover:text-rose-600 p-1 transition">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                    </button>
                                </td>
                            </tr>
                        `;
                        tbody.insertAdjacentHTML('beforeend', row);
                    });
                }

                document.getElementById('stat-total-budget').innerText = `RM ${totalBudget.toFixed(2)}`;
                document.getElementById('stat-total-claimed').innerText = `RM ${totalClaimed.toFixed(2)}`;
                document.getElementById('stat-total-count').innerText = data.length;
            } catch (err) {
                console.error('Fetch error:', err);
            }
        }

        document.addEventListener('DOMContentLoaded', fetchData);
    </script>
</body>
</html>
